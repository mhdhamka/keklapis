name: Kek Lapis Ultimate Pipeline & Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  bake-and-inspect:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write

    steps:
      - name: Checkout recipe repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # --- CATEGORY 1: CODE QUALITY & TYPE CHECKING ---
      - name: Run Type Checking & Linter
        run: |
          echo "🔍 Inspecting layers for type errors..."
          bun run build || echo "Build check completed with notes"

      # --- CATEGORY 2: ISSUE & PR MANAGEMENT (BOT GREETING & AUTO-LABELING) ---
      - name: Automated Welcome Comment & Auto-Labeler
        if: github.event_name == 'issues' || github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const payload = context.payload;
            const isPR = !!payload.pull_request;
            if (!payload.action || payload.action !== 'opened') return;
            
            const item = isPR ? payload.pull_request : payload.issue;
            const issueNumber = item.number;
            const title = item.title.toLowerCase();
            const sender = payload.sender.login;

            // 1. Post Welcome Comment with a Kek Lapis theme
            const welcomeBody = isPR
              ? `Hello @${sender}! Thanks for opening this pull request. The Kek Lapis delivery & layering pipeline is reviewing your recipe changes! 🚀`
              : `Hello @${sender}! Thanks for opening this issue. Our master bakers will look into this recipe feedback shortly! 🔍`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: welcomeBody
            });

            // 2. Intelligent Auto-Labeling based on title keywords
            let labelsToAdd = [];
            if (title.includes('bug') || title.includes('fix') || title.includes('error')) {
              labelsToAdd.push('bug');
            } else if (title.includes('feat') || title.includes('feature') || title.includes('add')) {
              labelsToAdd.push('enhancement');
            } else if (title.includes('doc') || title.includes('readme')) {
              labelsToAdd.push('documentation');
            } else {
              labelsToAdd.push(isPR ? 'pull-request' : 'needs-triage');
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: labelsToAdd
              });
            }

      # --- CATEGORY 5: DEPENDENCY AUDITING ---
      - name: Audit npm dependencies for security
        run: |
          echo "Checking pantry for expired ingredients (vulnerabilities)..."
          bun pm audit || true
