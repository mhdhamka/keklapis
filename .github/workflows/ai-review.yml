name: AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: AI Code Review with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${
            { secrets.GEMINI_API_KEY }
          } # Add this secret in your repo settings
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            // Fetch PR diff
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number
            });

            let diffSummary = files.map(f => `File: ${f.filename}\nChanges: +${f.additions} -${f.deletions}`).join('\n');

            // Construct review comment
            const commentBody = `### Kek Lapis AI Code Reviewer\n\nI've inspected the recipe changes for this pull request:\n\`\`\`text\n${diffSummary}\n\`\`\`\n\n*Everything looks layered and structured nicely! Keep up the good work.* 🚀`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: commentBody
            });
